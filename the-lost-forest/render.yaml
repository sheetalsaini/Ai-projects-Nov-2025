services:
  - type: web
    name: the-lost-forest
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: lost-forest-checkpoints
          property: connectionString

databases:
  - name: lost-forest-checkpoints
    plan: free
    databaseName: lostforest
    user: explorer
